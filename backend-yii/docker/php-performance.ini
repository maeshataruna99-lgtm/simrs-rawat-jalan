; Pengaturan performa PHP untuk server pengembangan `php -S` (SAPI CLI).
; Tanpa ini OPcache mati di CLI, sehingga setiap request membaca dan meng-compile ulang
; seluruh file Yii/vendor. Pada bind mount Windows (9p) satu file bisa butuh puluhan milidetik.

opcache.enable=1
opcache.enable_cli=1
opcache.memory_consumption=128
opcache.max_accelerated_files=20000
; Perubahan kode tetap terdeteksi, tetapi timestamp file baru dicek ulang tiap N detik
; (bawaan 60, env PHP_OPCACHE_REVALIDATE_FREQ). Nilai kecil seperti 2 membuat stat ke
; seluruh file di bind mount Windows cukup sering hingga p95 melonjak ke ~1,6 detik.
opcache.validate_timestamps=1
opcache.revalidate_freq=${PHP_OPCACHE_REVALIDATE_FREQ}

; Cache hasil resolve path agar autoloader tidak mengulang stat ke filesystem tiap request.
realpath_cache_size=4096K
realpath_cache_ttl=600
