# Lingkungan pengembangan lokal SIMRS Rawat Jalan.
# Jalankan: docker compose up -d. Nilai koneksi diambil dari file .env (salin dari .env.example).

services:
  postgres:
    image: postgres:16-alpine
    container_name: simrs-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      TZ: Asia/Jakarta
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 10

  yii:
    build: ./backend-yii
    container_name: simrs-yii
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      YII_DEBUG: ${YII_DEBUG}
      YII_ENV: ${YII_ENV}
      CORS_ORIGIN: ${CORS_ORIGIN}
      JWT_SECRET: ${JWT_SECRET}
      JWT_TTL: ${JWT_TTL}
      SEED_PASSWORD: ${SEED_PASSWORD:-simrs123}
      TZ: Asia/Jakarta
    ports:
      - "8080:8080"
    volumes:
      - ./backend-yii:/app
    depends_on:
      postgres:
        condition: service_healthy

  node:
    build: ./service-node
    container_name: simrs-node
    restart: unless-stopped
    environment:
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET}
      LAB_API_KEYS: ${LAB_API_KEYS}
      TZ: Asia/Jakarta
    ports:
      - "3000:3000"
    volumes:
      - ./service-node:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy

  react:
    build: ./frontend-react
    container_name: simrs-react
    restart: unless-stopped
    environment:
      DOCKER: "true"
      VITE_YII_URL: http://localhost:8080
      VITE_NODE_URL: http://localhost:3000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend-react:/app
      - /app/node_modules
    depends_on:
      - yii
      - node

volumes:
  pgdata:
