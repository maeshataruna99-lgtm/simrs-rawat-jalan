# Lingkungan pengembangan lokal SIMRS Rawat Jalan.
# Jalankan: docker compose up -d. Nilai koneksi diambil dari file .env (salin dari .env.example).

services:
  postgres:
    image: postgres:16-alpine
    container_name: simrs-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      TZ: Asia/Jakarta
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
